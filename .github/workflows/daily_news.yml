name: Daily News Summary Auto Runner

on:
  schedule:
    # 매일 한국 시간 오전 8시 (UTC 기준 전날 23:00)
    - cron: '0 23 * * *'
  # GitHub 화면에서 [Run workflow] 버튼으로 즉시 테스트할 수 있는 기능
  workflow_dispatch:

# GitHub 서버가 내 저장소의 파일을 수정/커밋할 수 있는 권한 부여
permissions:
  contents: write

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필요한 라이브러리 설치
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: 뉴스 요약 파이썬 스크립트 실행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news_runner.py

      - name: 수정된 news_history.json 자동 커밋 및 푸시
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add news_history.json
          git diff --staged --quiet || (git commit -m "Auto: 매일 뉴스 요약 업데이트" && git push)
